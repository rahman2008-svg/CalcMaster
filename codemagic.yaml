workflows:
  android-workflow:
    name: CalcMaster Fixed Build

    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Show project
        script: ls -R

      - name: Grant permission
        script: chmod +x gradlew

      - name: Upgrade Gradle wrapper (IMPORTANT FIX)
        script: ./gradlew wrapper --gradle-version 9.3.1

      - name: Clean project
        script: ./gradlew clean

      - name: Build APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
