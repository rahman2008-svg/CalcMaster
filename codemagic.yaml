workflows:
  android-workflow:
    name: CalcMaster Ultra Build (Resilient Mode)

    max_build_duration: 90

    environment:
      java: 17

      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Show full project structure
        script: ls -R || true

      - name: Make gradlew executable
        script: chmod +x gradlew || true

      - name: Clean project (safe mode)
        script: ./gradlew clean || gradle clean || true

      - name: Download dependencies (safe)
        script: ./gradlew dependencies || true

      - name: Build Debug APK (primary)
        script: ./gradlew assembleDebug || gradle assembleDebug || true

      - name: Locate APK (force find)
        script: find . -name "*.apk" || true

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/**/*.apk
      - "**/*.apk"

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
