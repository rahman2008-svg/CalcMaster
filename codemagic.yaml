workflows:
  android-workflow:
    name: CalcMaster Quick Build (Hack Mode)

    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Check project
        script: ls -la

      - name: Set execute permission (ignore error)
        script: chmod +x gradlew || true

      - name: Try Gradle Wrapper
        script: ./gradlew clean || echo "No gradlew found, skipping"

      - name: Build using system Gradle (fallback)
        script: gradle assembleDebug || echo "Gradle build attempted"

    artifacts:
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
