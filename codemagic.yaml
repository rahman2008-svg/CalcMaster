workflows:
  android-workflow:
    name: CalcMaster Build (Fixed)

    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Show project structure
        script: ls -R

      - name: Make gradlew executable (safe)
        script: chmod +x gradlew || true

      - name: Clean project
        script: gradle clean || ./gradlew clean || true

      - name: Build Debug APK (Primary)
        script: gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
