workflows:
  android-workflow:
    name: CalcMaster Production Stable Build

    max_build_duration: 120

    environment:
      java: 17

      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8"

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Show project structure
        script: ls -R

      - name: Fix gradlew permissions
        script: chmod +x gradlew

      # 🔥 FORCE remove signing dependency at runtime
      - name: Clean build (ignore signing)
        script: ./gradlew clean -x validateSigningDebug || true

      # 🔥 Force debug build without signing validation
      - name: Build Debug APK (force bypass signing)
        script: ./gradlew assembleDebug -x validateSigningDebug -x packageDebug

      # 🔍 Locate APK no matter where it is
      - name: Find APK output
        script: find . -type f -name "*.apk"

    artifacts:
      - "**/*.apk"

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
