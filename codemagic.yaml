workflows:
  android-workflow:
    name: CalcMaster Stable Build

    max_build_duration: 90

    environment:
      java: 17

      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Show project
        script: ls -R

      - name: Make gradlew executable
        script: chmod +x gradlew

      - name: Clean project
        script: ./gradlew clean

      - name: Build APK (ignore signing issue fix)
        script: ./gradlew assembleDebug -x validateSigningDebug

      - name: Find APK
        script: find . -name "*.apk"

    artifacts:
      - "**/*.apk"

    publishing:
      email:
        recipients:
          - prince.ar.abdur.rahman2008@gmail.com
